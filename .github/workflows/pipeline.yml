# 콘텐츠 파이프라인 자동 실행: 수집 → 품질 체크(알고리즘) → 기사 작성 → 사진 → 간체 → 배치 번역 → 사이트 화면 다시 그리기
# 필요한 저장소 Secrets: DATABASE_URL, ANTHROPIC_API_KEY, SITE_URL, INDEXNOW_KEY, REVALIDATE_SECRET(화면 비우기 — 없으면 새 글이 화면에 안 나온다)
# 선택 Secrets (비어 있어도 돈다): COLLECTOR_RELAY_URL·COLLECTOR_TOKEN(서울 수집 릴레이)
#
# 2시간마다 cron 으로만 돈다. 예전에는 이어 달리기(sleep 50분 뒤 다음 실행 예약) + 3시간 지킴이로 하루 28번 돌아
# DB 를 하루 약 3.4시간 깨웠고 러너를 실행마다 50분씩 잡았다 (2026-10-19 Neon 무료 한도 초과, docs/predeploy/cost.md).
# cron 이 한 번 빠지면 다음 실행은 2시간 뒤다. 급하면 gh workflow run pipeline 으로 바로 돌린다
name: pipeline

on:
  schedule:
    # UTC 짝수 시 17분 = KST 홀수 시 17분 (05:17 KST 실행이 하루 1번 작업을 맡는다). 정각은 GitHub 이 몰려 늦거나 빠뜨리기 쉽다
    - cron: "17 */2 * * *"
  # 운영 배포가 끝나면 글·인물 화면을 미리 그린다 (아래 warm 잡)
  deployment_status:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 쓸 기사 수"
        default: "7"

permissions:
  contents: read

jobs:
  run:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 겹치지 않게 차례로 돈다. 잡 단위로 둔다: 워크플로 단위면 배포 이벤트(대부분 건너뜀)가 기다리던 실행을 밀어낸다
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      COLLECTOR_RELAY_URL: ${{ secrets.COLLECTOR_RELAY_URL }}
      COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
      LLM_BUDGET_KRW: "100000"
      AUTO_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      # 마이그레이션은 migrations 폴더가 바뀐 뒤 처음 한 번만 (같은 내용으로 성공한 기록이 Actions 캐시에 있으면 건너뛴다).
      # 다시 돌려야 하면 Actions → Caches 에서 migrated-* 를 지운다
      - name: 마이그레이션 기록 확인
        id: migrated
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/migrated
          key: migrated-${{ hashFiles('packages/db/prisma/migrations/**') }}
          lookup-only: true
      - name: 마이그레이션
        if: steps.migrated.outputs.cache-hit != 'true'
        run: npm run db:migrate && mkdir -p .pipeline && date -u > .pipeline/migrated
      - name: 마이그레이션 기록 남기기
        if: steps.migrated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pipeline/migrated
          key: migrated-${{ hashFiles('packages/db/prisma/migrations/**') }}

      # 하루·주 1번 작업은 날짜 키로 정한다: 지난 실행이 남긴 기록(Actions 캐시, 가장 최근 것)과 지금 KST 날짜·ISO 주를 비교한다.
      # 시각(시)만 보면 실행이 밀리거나 빠질 때 두 번 돌거나 하루를 건너뛴다. 시작할 때 기록하므로 실패해도 그날은 다시 돌지 않는다
      - name: 지난 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/marks
          key: marks-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: marks-
      - name: 오늘 할 일 정하기
        id: due
        run: |
          mkdir -p .pipeline && touch .pipeline/marks
          mark() { sed -n "s/^$1=\([0-9W-]*\)$/\1/p" .pipeline/marks; }
          DATE_DONE=$(mark DATE_DONE); DAILY_DONE=$(mark DAILY_DONE); POLL_DONE=$(mark POLL_DONE); WEEKLY_DONE=$(mark WEEKLY_DONE)
          today=$(TZ=Asia/Seoul date +%F)
          week=$(TZ=Asia/Seoul date +%G-W%V)
          hour=$((10#$(TZ=Asia/Seoul date +%H)))
          weekday=$(TZ=Asia/Seoul date +%u)
          date_due=false; daily=false; weekly=false; poll=false; sets=""
          # 날짜가 바뀐 뒤 첫 실행: D-day 가 든 홈·일정 화면
          if [ "${DATE_DONE:-}" != "$today" ]; then date_due=true; sets="$sets date"; DATE_DONE=$today; fi
          # 05시(KST) 뒤 첫 실행: 원문 확인·상품·위키 조회수·랭킹 → 랭킹·인물·가이드·최근 글 화면
          if [ "${DAILY_DONE:-}" != "$today" ] && [ "$hour" -ge 5 ]; then daily=true; sets="$sets day"; DAILY_DONE=$today; fi
          # 주가 바뀐 뒤(월요일 00시 KST) 첫 실행: 주간 팬 투표 교대 + 주간 고정판 랭킹
          if [ "${POLL_DONE:-}" != "$week" ]; then poll=true; POLL_DONE=$week; fi
          # 월요일 03시(KST) 뒤 첫 실행: 인물 사전·인물 정보 → 쪽 번호 화면
          if [ "${WEEKLY_DONE:-}" != "$week" ] && { [ "$weekday" -gt 1 ] || [ "$hour" -ge 3 ]; }; then
            weekly=true; sets="$sets week"; WEEKLY_DONE=$week
          fi
          printf 'DATE_DONE=%s\nDAILY_DONE=%s\nPOLL_DONE=%s\nWEEKLY_DONE=%s\n' \
            "${DATE_DONE:-}" "${DAILY_DONE:-}" "${POLL_DONE:-}" "${WEEKLY_DONE:-}" > .pipeline/marks
          changed=false
          if [ "$date_due$daily$weekly$poll" != falsefalsefalsefalse ]; then changed=true; fi
          sets=${sets# }
          {
            echo "daily=$daily"
            echo "weekly=$weekly"
            echo "poll=$poll"
            echo "sets=$sets"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "KST $today ${hour}시 · 하루 작업 $daily · 주 작업 $weekly · 주간 투표 $poll · 다시 그릴 화면: ${sets:-없음}"

      - name: 원문 삭제 확인 (하루 1번)
        if: steps.due.outputs.daily == 'true'
        run: npm run worker -- recheck
      - name: 편의점 상품 수집 (하루 1번, K-쇼핑 주간 랭킹)
        if: steps.due.outputs.daily == 'true'
        run: npm run worker -- products
      - name: 인물 사전 갱신 (주 1회)
        if: steps.due.outputs.weekly == 'true'
        run: npm run worker -- entities
      # 랭킹 쪽 단계는 실패해도 글 작성은 계속한다
      - name: 인물 페이지 정보 (주 1회)
        if: steps.due.outputs.weekly == 'true'
        continue-on-error: true
        run: npm run worker -- entity-meta
      - name: 위키백과 조회수 (하루 1번)
        if: steps.due.outputs.daily == 'true'
        continue-on-error: true
        run: npm run worker -- wiki-sync
      - name: 주간 팬 투표 교대 (월요일 00시 KST 뒤 첫 실행)
        if: steps.due.outputs.poll == 'true'
        continue-on-error: true
        run: npm run worker -- weekly-poll
      - name: 랭킹 스냅숏 (하루 1번 + 주간 고정판)
        if: steps.due.outputs.daily == 'true' || steps.due.outputs.poll == 'true'
        continue-on-error: true
        run: npm run worker -- rankings
      # 2시간마다 7편까지 (예전 하루 28번 × 3편과 비슷한 상한). 발행한 글은 작성이 끝난 뒤 한 번에 화면을 비우고 미리 요청한다
      - name: 수집 → 체크 → 작성
        run: npm run worker -- pipeline ${{ github.event.inputs.limit || '7' }}
      - run: npm run worker -- zh-cn
      - name: vi·id·fr·ru 배치 번역 (지난 배치 거두기 + 새로 보내기)
        run: npm run worker -- translate
      - run: npm run worker -- cost
      # 앞 단계가 실패해도 정해진 화면은 다시 그린다 (DB 가 깨어 있는 지금 그려야 봇이 나중에 DB 를 깨우지 않는다)
      - name: 사이트 화면 다시 그리기 (날짜·하루·주)
        if: always() && steps.due.outcome == 'success' && steps.due.outputs.sets != ''
        continue-on-error: true
        env:
          SETS: ${{ steps.due.outputs.sets }}
        run: npm run worker -- refresh $SETS
      - name: 오늘 한 일 기록
        if: always() && steps.due.outcome == 'success' && steps.due.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .pipeline/marks
          key: marks-${{ github.run_id }}-${{ github.run_attempt }}

  # 운영 배포 직후: 새 배포는 화면 캐시가 비어 있다. 빌드 때 만들지 않는 글·인물 화면을 지금 한꺼번에 그려,
  # 봇이 하루 내내 하나씩 열며 DB 를 띄엄띄엄 깨우지 않게 한다. 미리보기·옛 프로젝트(nextneonews*) 배포는 건너뛴다
  warm:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      !contains(github.event.deployment.environment, 'nextneonews')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: warm
      cancel-in-progress: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # 스키마를 바꾼 배포면 화면을 그리기 전에 마이그레이션부터 (run 잡과 같은 기록을 쓴다)
      - name: 마이그레이션 기록 확인
        id: migrated
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/migrated
          key: migrated-${{ hashFiles('packages/db/prisma/migrations/**') }}
          lookup-only: true
      - name: 마이그레이션
        if: steps.migrated.outputs.cache-hit != 'true'
        run: npm run db:migrate && mkdir -p .pipeline && date -u > .pipeline/migrated
      - name: 마이그레이션 기록 남기기
        if: steps.migrated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pipeline/migrated
          key: migrated-${{ hashFiles('packages/db/prisma/migrations/**') }}
      - name: 배포 직후 화면 미리 그리기
        run: npm run worker -- refresh deploy
