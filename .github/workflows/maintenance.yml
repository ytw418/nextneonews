# 사람이 눌러서 한 번 돌리는 운영 정리 작업 (정해 둔 명령만 고를 수 있다).
# 운영 비밀값(SITE_URL·REVALIDATE_SECRET·INDEXNOW_KEY)이 Actions 에만 있어서, 화면 캐시 비우기까지 해야 하는 일은 여기서 돌린다.
# 실행: gh workflow run maintenance -f command="unpublish --off-topic --dry"
name: maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: "worker 명령"
        type: choice
        default: "unpublish --off-topic --dry"
        options:
          - "unpublish --off-topic --dry"
          - "unpublish --off-topic"
          - "cost"
          - "fix-script --dry"
          - "fix-script"
          - "regate --dry"
          - "regate"
          - "seed-topic"
      names:
        description: "fix-script 에 줄 이름 짝 (공백으로 구분, 예: イム・シワン=任時完)"
        type: string
        default: ""
      title:
        description: "seed-topic 제목 (예: 이수만 걸그룹 A2O LITE 'NEON' 멜론 1위)"
        type: string
        default: ""
      url:
        description: "seed-topic 원문 기사 주소"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 파이프라인과 같은 DB 를 쓰므로 겹치지 않게 같은 묶음으로 차례를 기다린다
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # regate 의 관련성 판정(AI). 누적 예산 상한은 위 LLM_BUDGET_KRW 가 지킨다
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_BUDGET_KRW: "100000"
      # 셸에 바로 끼우지 않고 환경변수로 넘긴다 (입력이 명령으로 해석되지 않게)
      FIX_SCRIPT_NAMES: ${{ inputs.names }}
      SEED_TITLE: ${{ inputs.title }}
      SEED_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - if: inputs.command != 'seed-topic'
        run: npm run worker -- ${{ inputs.command }}
      - if: inputs.command == 'seed-topic'
        run: npm run worker -- seed-topic "$SEED_TITLE" --source manual --url "$SEED_URL"
